name: HealthOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTHOPS_ENV: test
      HEALTHOPS_LLM_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q server.py settings.py persistence.py analytics_engine.py llm_analyst.py healthops_db alembic

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v